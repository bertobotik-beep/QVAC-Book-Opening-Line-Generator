<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Book Opening Line Generator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #fdf6f0 0%, #f2e2d8 100%);
    font-family: system-ui, -apple-system, sans-serif;
    color: #4a2f27;
    display: flex;
    justify-content: center;
    padding: 46px 20px;
  }
  .wrap { width: 100%; max-width: 520px; text-align: center; }
  .icon { font-size: 2rem; margin-bottom: 4px; }
  h1 { font-size: 1.6rem; margin: 0 0 6px; color: #a14e3a; font-weight: 800; }
  .subtitle { color: #8f6a5c; margin-bottom: 24px; font-size: 0.9rem; }
  .card {
    background: #fffaf7;
    border: 2px solid #e8cabb;
    border-radius: 20px;
    padding: 30px 26px;
  }
  input[type=text] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid #e8cabb;
    background: #fff;
    color: #4a2f27;
    font-family: inherit;
    font-size: 1rem;
    margin-bottom: 14px;
    text-align: center;
  }
  button.action {
    padding: 12px 28px;
    border: none;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    background: #a14e3a;
    color: #fff;
    box-shadow: 0 5px 0 #6d3122;
    margin-top: 4px;
  }
  button.action:active { transform: translateY(3px); box-shadow: 0 2px 0 #6d3122; }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #8f6a5c; min-height: 1.2em; }
  .lines { text-align: left; margin-top: 18px; padding: 0; list-style: none; }
  .lines li {
    font-size: 1.02rem;
    line-height: 1.6;
    color: #4a2f27;
    font-style: italic;
    background: #f7e9df;
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 10px;
  }
  .footer-note { color: #8f6a5c; font-size: 0.78rem; margin-top: 20px; }
  .spinner {
    display: inline-block;
    width: 13px; height: 13px;
    border: 2px solid #e8cabb;
    border-top-color: #a14e3a;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">📖</div>
    <h1>Book Opening Line Generator</h1>
    <p class="subtitle">Enter a genre and a theme, get a few possible opening lines. 100% on-device.</p>

    <div class="card">
      <input type="text" id="genreInput" placeholder="Genre, e.g. mystery, fantasy, sci-fi" />
      <input type="text" id="themeInput" placeholder="Theme, e.g. a forgotten promise" />
      <button class="action" id="generateBtn">Give Me Lines</button>
      <div class="status" id="status"></div>
      <ul class="lines" id="resultBox"></ul>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const genreInput = document.getElementById('genreInput');
    const themeInput = document.getElementById('themeInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');

    async function generate() {
      const genre = genreInput.value.trim();
      const theme = themeInput.value.trim();
      if (!genre || !theme) return;
      generateBtn.disabled = true;
      resultBox.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Drafting opening lines...';

      try {
        const res = await fetch('/api/openingLines', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ genre, theme }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultBox.innerHTML = data.lines.map((l) => `<li>${escapeHtml(l)}</li>`).join('');
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
    themeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') generate(); });
    genreInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') generate(); });
  </script>
</body>
</html>
